openapi: 3.1.0
info:
  title: Connectome API
  version: 1.0.0-design
  description: Core of the public API. All model writes go through changes. Edit shapes mirror 05-structures/changes.ts.
servers:
  - url: https://{region}.connectome.app/api/v1
    variables:
      region: { default: eu, enum: [eu, us, au] }
security:
  - bearer: []

paths:
  /repositories:
    get:
      summary: Repositories in the caller's workspace
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Repository' } } } } }
    post:
      summary: Create a repository with a baseline scenario and a metamodel, the Essentials package unless one is sent (an exported metamodel, or an empty one to start from scratch). 422 when the metamodel fails its schema or does not compile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                id: { type: string }
                name: { type: string }
                description: { type: string }
                metamodel:
                  type: object
                  required: [package, diagramTypes]
                  description: The metamodel to start from, in the shape of the snapshot's metamodel and an exported metamodel file
                  properties:
                    package: { type: object, description: 'A package (05-structures/metamodel.schema.json); version 1.0.0 when it has none' }
                    diagramTypes: { type: array, items: { type: object, description: 05-structures/diagram-type.schema.json } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Repository' } } } }
        '422': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}:
    parameters: [ { $ref: '#/components/parameters/repo' } ]
    get:
      summary: A repository and its scenarios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Repository' }
                  - { type: object, properties: { scenarios: { type: array, items: { $ref: '#/components/schemas/Scenario' } } } }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a repository with its metamodel, scenarios, model, diagrams and change log. It cannot be undone
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/scenarios:
    parameters: [ { $ref: '#/components/parameters/repo' } ]
    get:
      summary: Scenarios of a repository, baseline first
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Scenario' } } } } }

  /live/tickets:
    post:
      summary: A short-lived ticket for opening the live connection from a browser (which cannot set headers on a WebSocket)
      responses:
        '200':
          description: Valid for 60 seconds
          content: { application/json: { schema: { type: object, required: [ticket, expiresAt], properties: { ticket: { type: string }, expiresAt: { type: string, format: date-time } } } } }

  /live:
    get:
      summary: Live connection (WebSocket). Messages are ClientMessage / ServerMessage in 05-structures/changes.ts
      description: >
        Sign in with the Authorization header or ?ticket=. After catching up from ?since= (or immediately), the server
        streams `committed` changes of the scenario and its ancestors in sequence order, `presence`, and `rejected` for
        the sender's own failed submits. A client more than 1,000 changes behind gets `resync` and reloads.
        Close codes: 4400 bad query, 4404 unknown repository or scenario.
      security: [ { bearer: [] }, {} ]
      parameters:
        - { name: repository, in: query, required: true, schema: { type: string } }
        - { name: scenario, in: query, schema: { type: string }, description: Scenario id (default baseline) }
        - { name: since, in: query, schema: { type: integer }, description: Last sequence number the client has applied }
        - { name: ticket, in: query, schema: { type: string } }
      responses:
        '101': { description: Switching protocols }
        '401': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/snapshot:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' } ]
    get:
      summary: The whole scenario as change-engine rows, with the metamodel, for the web app's local store
      description: >
        Rows include deleted ones (tombstones) with their versions and field versions, so the browser can run the
        change engine on them. Open the live connection with ?since= the returned seq. Whole-repository loading is
        an M0 simplification (decision B16).
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Snapshot' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/folders:
    parameters: [ { $ref: '#/components/parameters/repo' } ]
    get:
      summary: Folder tree
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Folder' } } } } }

  /repositories/{repo}/objects:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' } ]
    get:
      summary: Find objects with the query language
      parameters:
        - { name: q, in: query, schema: { type: string }, example: 'type:application AND lifecycle.status = active' }
        - { name: include, in: query, schema: { type: string }, example: 'properties,relationships' }
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  seq: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/ModelObject' } }
                  hidden: { type: integer }
                  nextCursor: { type: [string, 'null'] }

  /repositories/{repo}/objects/{id}:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: One object
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/ModelObject' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/objects/{id}/occurrences:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: Diagrams on which the object occurs
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { type: object, properties: { diagramId: { type: string }, diagramName: { type: string }, occurrenceId: { type: string } } } }

  /repositories/{repo}/objects/{id}/relationships:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: Relationships from and to an object
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Relationship' } } } } }

  /repositories/{repo}/objects/{id}/trace:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: Objects reached from this one by meaning (02-model/semantics.md §9.3)
      parameters:
        - { name: kind, in: query, required: true, schema: { type: string, enum: [levels, flow, payload, dependency] },
            description: 'levels: realisation and representation; flow: flows and messages; payload: flows carrying it or its representations; dependency: serving, access, interactions and flows' }
        - { name: direction, in: query, schema: { type: string, enum: [forward, backward], default: forward },
            description: 'forward: down the levels, downstream, receivers, what it depends on; backward: the opposite' }
        - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 6 } }
        - { name: contents, in: query, schema: { type: boolean, default: false }, description: "flow and dependency: a container's relationships count as its contents'" }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Trace' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/objects/{id}/history:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: The edits that touched an object, newest first
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: object, properties: { seq: { type: integer }, changeId: { type: string }, label: { type: string }, actor: { type: [string, 'null'] }, source: { type: string }, scenarioId: { type: string }, committedAt: { type: string, format: date-time }, edit: { $ref: '#/components/schemas/Edit' } } }

  /repositories/{repo}/relationships/{id}:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: One relationship
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Relationship' } } } }
        '404': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/relationships:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' } ]
    get:
      summary: Find relationships
      parameters:
        - { name: type, in: query, schema: { type: string } }
        - { name: source, in: query, schema: { type: string } }
        - { name: target, in: query, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Relationship' } } } } }

  /repositories/{repo}/changes:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' } ]
    post:
      summary: Commit a change (atomic list of edits)
      parameters:
        - { name: preview, in: query, schema: { type: boolean, default: false } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ChangeRequestBody' } } }
      responses:
        '200': { description: 'Preview (preview=true): the outcome if committed; nothing is written. seq is null', content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } }
        '201': { description: 'Committed. Resending a change id returns the original outcome', content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } }
        '202': { description: Held for review by a governance policy, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
    get:
      summary: Committed changes since a sequence number
      parameters: [ { name: since, in: query, required: true, schema: { type: integer } } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/ChangeSummary' } } } } }

  /repositories/{repo}/changes/{changeId}/undo:
    parameters: [ { $ref: '#/components/parameters/repo' }, { name: changeId, in: path, required: true, schema: { type: string } } ]
    post:
      summary: Undo one of your own changes (a new change built from inverse edits). 403 for other people's changes, 422 if already undone
      requestBody:
        required: false
        content: { application/json: { schema: { type: object, properties: { id: { type: string, description: 'Id for the new change, so retries are safe' } } } } }
      responses:
        '201': { description: Undone, content: { application/json: { schema: { $ref: '#/components/schemas/ChangeResult' } } } }

  /repositories/{repo}/metamodel/relationship-rules:
    parameters: [ { $ref: '#/components/parameters/repo' } ]
    put:
      summary: Replace the relationship rules and publish them as the next metamodel version (02-model/notation-and-metamodel-admin.md §10). Existing relationships are kept; those the new rules refuse are listed. 409 when baseVersion is not the current version
      parameters:
        - { name: preview, in: query, schema: { type: boolean, default: false }, description: 'Report the outcome without publishing' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, relationshipRules]
              properties:
                baseVersion: { type: string, description: The metamodel version the rules were edited from }
                relationshipRules: { type: array, items: { $ref: '#/components/schemas/RelationshipRule' } }
      responses:
        '200': { description: Published (or previewed), content: { application/json: { schema: { $ref: '#/components/schemas/RulesResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/metamodel:
    parameters: [ { $ref: '#/components/parameters/repo' } ]
    put:
      summary: Replace the whole metamodel with an edited draft and publish it as the next metamodel version (slice A-1b; 02-model/metamodel.md §7). Stored values are kept; values the new types stop carrying are counted. 422 when the draft fails its schema, does not compile, or would break stored data (a type in use removed, a data type changed while values exist, a list value in use removed). 409 when baseVersion is not the current version
      parameters:
        - { name: preview, in: query, schema: { type: boolean, default: false }, description: 'Report the outcome without publishing' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [baseVersion, metamodel, diagramTypes]
              properties:
                baseVersion: { type: string, description: The metamodel version the draft was edited from }
                metamodel: { type: object, description: 'A package (05-structures/metamodel.schema.json); its version is set by the server' }
                diagramTypes: { type: array, items: { type: object, description: 05-structures/diagram-type.schema.json } }
      responses:
        '200': { description: Published (or previewed), content: { application/json: { schema: { $ref: '#/components/schemas/MetamodelResult' } } } }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /repositories/{repo}/diagrams/{id}:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: A diagram with its occurrences and annotations
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Diagram' } } } }

  /repositories/{repo}/diagrams/{id}/render:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/scenario' }, { $ref: '#/components/parameters/id' } ]
    get:
      summary: Render a diagram
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [svg, png, pdf] } }
        - { name: asOf, in: query, schema: { type: string, format: date } }
      responses:
        '200': { description: File, content: { image/svg+xml: {}, image/png: {}, application/pdf: {} } }

  /repositories/{repo}/scenarios/{scenarioId}/compare:
    parameters: [ { $ref: '#/components/parameters/repo' }, { name: scenarioId, in: path, required: true, schema: { type: string } } ]
    post:
      summary: Compare with another scenario
      parameters: [ { name: with, in: query, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Differences, content: { application/json: { schema: { $ref: '#/components/schemas/Comparison' } } } }

  /repositories/{repo}/automations/{id}/runs:
    parameters: [ { $ref: '#/components/parameters/repo' }, { $ref: '#/components/parameters/id' } ]
    post:
      summary: Start a hosted automation run (later phase; launch automation uses this API from any language)
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { parameters: { type: object }, preview: { type: boolean }, scenario: { type: string } } }
      responses:
        '202': { description: Queued, content: { application/json: { schema: { $ref: '#/components/schemas/AutomationRun' } } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    repo: { name: repo, in: path, required: true, schema: { type: string } }
    id: { name: id, in: path, required: true, schema: { type: string } }
    scenario: { name: scenario, in: query, required: false, schema: { type: string }, description: Scenario id (default baseline) }
  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              title: { type: string }
              status: { type: integer }
              code: { type: string, enum: [conflict, ruleViolation, forbidden, notFound, invalid, gone, unauthenticated] }
              details:
                type: array
                items: { type: object, properties: { editIndex: { type: integer }, property: { type: string }, rule: { type: string }, message: { type: string }, itemId: { type: string }, changedBy: { type: string } } }
  schemas:
    RelationshipRule:
      type: object
      required: [relationshipType, sourceType, targetType]
      properties:
        relationshipType: { type: string }
        sourceType: { type: string, description: 'An object type key (its subtypes included) or *' }
        targetType: { type: string }
        cardinality: { type: string, enum: ['0..1', '0..*', '1..1', '1..*'] }
        enforcement: { type: string, enum: [block, warn], default: block }
    MetamodelResult:
      allOf:
        - { $ref: '#/components/schemas/RulesResult' }
        - type: object
          required: [stranded]
          properties:
            stranded:
              type: array
              description: Values the new types stop carrying, per property type; they stay stored
              items:
                type: object
                required: [propertyType, count]
                properties:
                  propertyType: { type: string }
                  count: { type: integer }
    RulesResult:
      type: object
      required: [version, preview, newlyRefused]
      properties:
        version: { type: string }
        preview: { type: boolean }
        newlyRefused:
          type: array
          items:
            type: object
            required: [relationshipType, sourceType, targetType, count]
            properties:
              relationshipType: { type: string }
              sourceType: { type: string }
              targetType: { type: string }
              count: { type: integer }
    Repository:
      type: object
      required: [id, name, seq, baselineScenarioId]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        metamodelVersion: { type: string }
        seq: { type: integer, description: Sequence number of the last committed change }
        baselineScenarioId: { type: string }
    Scenario:
      type: object
      required: [id, name, state]
      properties:
        id: { type: string }
        parentId: { type: [string, 'null'] }
        name: { type: string }
        state: { type: string, enum: [baseline, draft, proposed, approved, merged, archived] }
        branchedAtSeq: { type: [integer, 'null'] }
    Snapshot:
      type: object
      required: [repository, scenario, seq, metamodel, rows]
      properties:
        repository: { $ref: '#/components/schemas/Repository' }
        scenario: { $ref: '#/components/schemas/Scenario' }
        seq: { type: integer, description: Sequence number the rows reflect }
        metamodel:
          type: object
          required: [package, diagramTypes]
          properties:
            package: { type: object, description: A metamodel package (05-structures/metamodel.schema.json) }
            diagramTypes: { type: array, items: { type: object, description: 05-structures/diagram-type.schema.json } }
        rows:
          type: object
          description: Engine rows per collection (packages/engine/src/rows.ts)
          required: [folders, objects, relationships, diagrams, objectOccurrences, relationshipOccurrences, annotations]
          additionalProperties: false
          properties:
            folders: { type: array, items: { $ref: '#/components/schemas/SnapshotRow' } }
            objects: { type: array, items: { $ref: '#/components/schemas/SnapshotVersionedRow' } }
            relationships: { type: array, items: { $ref: '#/components/schemas/SnapshotVersionedRow' } }
            diagrams: { type: array, items: { $ref: '#/components/schemas/SnapshotVersionedRow' } }
            objectOccurrences: { type: array, items: { $ref: '#/components/schemas/SnapshotRow' } }
            relationshipOccurrences: { type: array, items: { $ref: '#/components/schemas/SnapshotRow' } }
            annotations: { type: array, items: { $ref: '#/components/schemas/SnapshotRow' } }
    SnapshotRow:
      type: object
      required: [id, deleted]
      properties: { id: { type: string }, deleted: { type: boolean } }
    SnapshotVersionedRow:
      allOf:
        - { $ref: '#/components/schemas/SnapshotRow' }
        - type: object
          required: [version, fieldVersions]
          properties:
            version: { type: integer }
            fieldVersions:
              type: object
              additionalProperties: { type: object, required: [v, by], properties: { v: { type: integer }, by: { type: string } } }
    Folder:
      type: object
      required: [id, name]
      properties: { id: { type: string }, parentId: { type: [string, 'null'] }, name: { type: string }, rank: { type: string, description: 'Explorer order (edit setRank); absent when unranked' } }
    Properties:
      type: object
      additionalProperties: true
      description: 'Property key → value, e.g. {"lifecycle.status": "active"}'
    ModelObject:
      type: object
      required: [id, type, name, folderId, version]
      properties:
        id: { type: string }
        type: { type: string }
        name: { type: string }
        key: { type: [string, 'null'] }
        folderId: { type: string }
        description: { type: string }
        rank: { type: string, description: 'Explorer order among its siblings (edit setRank); absent when unranked' }
        properties: { $ref: '#/components/schemas/Properties' }
        tags: { type: array, items: { type: string } }
        externalIds: { type: object, additionalProperties: { type: string } }
        confirmations:
          type: object
          description: 'Who last confirmed each property value and when (edit confirmProperties); absent when none'
          additionalProperties: { type: object, required: [by, at], properties: { by: { type: string }, at: { type: string } } }
        aliases: { type: array, items: { type: string }, description: 'Other names it goes by (edit setAliases); absent when none' }
        notDuplicates:
          type: array
          description: 'Objects it was judged not to duplicate, with both names at the time (edit setNotDuplicates); absent when none'
          items: { type: object, required: [of, name, otherName], properties: { of: { type: string }, name: { type: string }, otherName: { type: string } } }
        version: { type: integer }
    Relationship:
      type: object
      required: [id, type, sourceId, targetId, version]
      properties:
        id: { type: string }
        type: { type: string }
        sourceId: { type: string }
        targetId: { type: string }
        name: { type: string }
        properties: { $ref: '#/components/schemas/Properties' }
        derivedBy: { type: [string, 'null'] }
        payload: { type: array, items: { type: string }, description: 'Objects the relationship carries (semantics §5)' }
        parentId: { type: [string, 'null'], description: 'The interaction this flow is a message of (semantics §6)' }
        rank: { type: integer, description: 'Orders the messages of an interaction' }
        version: { type: integer }
    Trace:
      type: object
      required: [kind, direction, startId, steps, truncated]
      properties:
        kind: { type: string, enum: [levels, flow, payload, dependency] }
        direction: { type: string, enum: [forward, backward] }
        startId: { type: string }
        truncated: { type: boolean }
        steps:
          type: array
          description: Each object once, nearest first
          items:
            type: object
            required: [objectId, name, type, depth, relationshipId, fromId]
            properties:
              objectId: { type: string }
              name: { type: string }
              type: { type: string }
              level: { type: [string, 'null'] }
              depth: { type: integer, description: Relationships followed from the start }
              relationshipId: { type: string, description: The relationship that reached it }
              fromId: { type: string, description: 'The object at its other end (payload: the object carried)' }
    Edit:
      type: object
      required: [edit]
      description: One edit; see 05-structures/changes.ts for every shape.
      properties:
        edit:
          type: string
          enum: [createObject, setProperties, renameObject, moveToFolder, changeObjectType, deleteObject,
                 createRelationship, reconnectRelationship, changeRelationshipType, setPayload, deleteRelationship,
                 createFolder, renameFolder, moveFolder, deleteFolder,
                 createDiagram, updateDiagram, deleteDiagram, setViewDefinition, setMessageStep,
                 addObjectOccurrence, moveObjectOccurrence, styleOccurrence, setDrillDown, removeOccurrence,
                 addRelationshipOccurrence, routeRelationshipOccurrence, addAnnotation, updateAnnotation, removeAnnotation,
                 setTags, setDescription, confirmProperties, setConfirmations, setAliases, setNotDuplicates,
                 setRelationshipProperties, setDiagramProperties]
      additionalProperties: true
    ChangeRequestBody:
      type: object
      required: [id, label, edits]
      properties:
        id: { type: string }
        label: { type: string }
        changeRequestId: { type: string }
        edits: { type: array, minItems: 1, maxItems: 10000, items: { $ref: '#/components/schemas/Edit' } }
    ChangeResult:
      type: object
      properties:
        seq: { type: [integer, 'null'] }
        changeId: { type: string }
        preview: { type: boolean }
        versions: { type: object, additionalProperties: { type: integer } }
        heldInChangeRequest: { type: [string, 'null'] }
        findings:
          type: array
          items: { type: object, properties: { rule: { type: string }, itemId: { type: string }, severity: { type: string }, message: { type: string } } }
    ChangeSummary:
      type: object
      properties:
        seq: { type: integer }
        changeId: { type: string }
        scenarioId: { type: string }
        label: { type: string }
        actor: { type: [string, 'null'] }
        source: { type: string }
        committedAt: { type: string, format: date-time }
        edits: { type: array, items: { $ref: '#/components/schemas/Edit' } }
    Diagram:
      type: object
      required: [id, name, diagramType, folderId]
      properties:
        id: { type: string }
        name: { type: string }
        diagramType: { type: string }
        folderId: { type: string }
        rank: { type: string, description: 'Explorer order among its siblings (edit setRank); absent when unranked' }
        definition: { type: object, description: 'What a matrix or other view shows (edit setViewDefinition); absent for canvases' }
        properties: { type: object, description: 'Values of its diagram type''s properties (edit setDiagramProperties); absent when none' }
        objectOccurrences:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              objectId: { type: string }
              parentOccurrenceId: { type: [string, 'null'] }
              x: { type: integer }
              y: { type: integer }
              w: { type: integer }
              h: { type: integer }
              z: { type: integer }
              style: { type: object }
        relationshipOccurrences:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              relationshipId: { type: string }
              sourceOccurrenceId: { type: string }
              targetOccurrenceId: { type: string }
              shownAs: { type: string, enum: [line, nesting] }
              route: { type: object }
              step: { type: string, description: 'Order in a sequence view (edit setMessageStep); absent elsewhere' }
        annotations: { type: array, items: { type: object } }
    Comparison:
      type: object
      properties:
        objects: { $ref: '#/components/schemas/ItemDifferences' }
        relationships: { $ref: '#/components/schemas/ItemDifferences' }
        diagrams: { type: array, items: { type: object, properties: { diagramId: { type: string }, added: { type: integer }, removed: { type: integer }, moved: { type: integer } } } }
    ItemDifferences:
      type: object
      properties:
        added: { type: array, items: { type: string } }
        removed: { type: array, items: { type: string } }
        changed: { type: array, items: { type: object, properties: { id: { type: string }, properties: { type: object } } } }
    AutomationRun:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [queued, running, succeeded, failed, cancelled, timedOut] }
        preview: { type: boolean }
        report: { type: [object, 'null'] }

# Local PostgreSQL 16 for development and the database tests:
#   docker compose up -d
#   export DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:
